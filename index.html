var HT=30,home={x:10,z:-8,ty:HT};
var steps=[];
for(n=0;n<12;n++){
var f=n%6,px=pickX[f],pz=trackZ[f],sx=slotX[n],sz=slotZ[n];
steps.push({x:px,z:pz,ty:HT,d:0.45},{x:px,z:pz,ty:15.3,d:0.18},{x:px,z:pz,ty:HT,d:0.18},{x:sx,z:sz,ty:HT,d:0.45},{x:sx,z:sz,ty:13.2,d:0.18},{x:sx,z:sz,ty:HT,d:0.18});
}
steps.push({x:home.x,z:home.z,ty:HT,d:0.9});
var W=0;steps.forEach(function(s){s.t0=W;W+=s.d;});
var CYC=W+2.5;
function Tw(j){return 7+j*CYC;}
var TEND=Tw(NP-1)+W+3.0;
var tAnim=0,tVib=0,animOn=true,autoRot=false,spdI=0,spds=[1,2,4];
var pinY=7,fingY=18;
function ease(u){return u*u*(3-2*u);}
function cl(v){return v<0?0:(v>1?1:v);}
function trayZ(t){
for(var j=0;j<NP;j++){
var a=Tw(j)-3.5;
if(t>=a&&t<a+2.0)return ZB+(ZF-ZB)*ease(cl((t-a)/2.0));
if(t>=a+2.0&&t<a+2.4)return ZF;
if(t>=a+2.4&&t<a+4.4)return ZF+(ZB-ZF)*ease(cl((t-a-2.4)/2.0));
}
return ZB;
}
function applyAll(t,dt){
var workJ=-1,j,k;
for(j=0;j<NP;j++){if(t>=Tw(j)&&t<Tw(j)+W)workJ=j;}
var s=-1,e=0;
if(workJ>=0){
var lw=t-Tw(workJ);
for(var i=0;i<steps.length;i++){if(lw<steps[i].t0+steps[i].d){s=i;e=ease(cl((lw-steps[i].t0)/steps[i].d));break;}}
if(s<0){s=steps.length-1;e=1;}
var to=steps[s],from=s===0?home:steps[s-1];
bridge.position.z=from.z+(to.z-from.z)*e;
carriage.position.x=from.x+(to.x-from.x)*e;
slide.position.y=from.ty+(to.ty-from.ty)*e;
}else{
bridge.position.z=home.z;carriage.position.x=home.x;slide.position.y=home.ty;
}
var fi=s>=0?Math.floor(s/6):0,st=s>=0?s%6:0,fed=fi%6,inFuse=(workJ>=0&&fi<12);
for(k=0;k<6;k++){
heldG[k].visible=inFuse&&k===fed&&st>=2&&st<=4;
trackQ[k][0].visible=!(inFuse&&k===fed&&st===2);
}
var cnts=[],kC=0,fC=0,travel=false,outing=false,pinDown=false;
for(j=0;j<NP;j++){
var tj=Tw(j),pl=plates[j],x,z,cnt;
if(t<tj-7){pl.g.visible=false;}else{pl.g.visible=true;}
if(t<tj-3.5){x=XB+(XT-XB)*ease(cl((t-(tj-7))/3.5));z=ZB;}
else if(t<tj-1.5){x=XT;z=ZB+(ZF-ZB)*ease(cl((t-(tj-3.5))/2.0));}
else if(t<tj){x=XT+(XW-XT)*ease(cl((t-(tj-1.5))/1.5));z=ZF;}
else if(t<tj+W){x=XW;z=ZF;}
else{x=XW+(XB-XW)*ease(cl((t-tj-W)/3.0));z=ZF;}
if(t<tj)cnt=0;else if(t<tj+W)cnt=(fi>=12?12:fi+(st===5?1:0));else cnt=12;
cnts.push(cnt);
pl.g.position.set(x,PY,z);
for(k=0;k<12;k++)pl.fuses[k].visible=k<cnt;
var fin=t>=tj+W;
pl.tm.color.setHex(fin?0x2EE86A:0xFFB020);
pl.tm.emissive.setHex(fin?0x0B5A28:0x7A4A00);
if(t<tj)kC++;
if(fin)fC++;
if(t>=tj-7&&t<tj)travel=true;
if(t>=tj+W&&t<tj+W+3.0)outing=true;
if(t>=tj+W&&t<tj+W+1.0)pinDown=true;
}
tray.position.z=trayZ(t);
var pinTarget=pinDown?-3:7;
pinY+=(pinTarget-pinY)*Math.min(1,dt*10);
stopper.position.y=pinY;
var fTarget=workJ>=0?13:18;
fingY+=(fTarget-fingY)*Math.min(1,dt*10);
fingers.forEach(function(fg){fg.position.y=fingY;});
var p=Math.min(NP-1,fC);
var ph=workJ>=0?'INSERT FUSE':(travel?'PLATE KOSONG MASUK':(outing?'PLATE TERISI KELUAR':(t>=TEND?'SELESAI':'MENUNGGU')));
var sig=[ph,p,cnts[p],kC,fC,animOn].join('|');
if(sig!==lastSig){
lastSig=sig;
drawHMI({run:animOn,ph:ph,p:p,cnt:cnts[p],kC:kC,fC:fC});
stat.textContent='Plate '+(p+1)+'/'+NP+' - '+ph+' | Atas (kosong): '+kC+' | Bawah (terisi): '+fC;
}
}

var theta=0.75,phi=1.0,radius=500,tgt=new THREE.Vector3(4,10,-5);
function updateCam(){
camera.position.set(tgt.x+radius*Math.sin(phi)*Math.sin(theta),tgt.y+radius*Math.cos(phi),tgt.z+radius*Math.sin(phi)*Math.cos(theta));
camera.lookAt(tgt);
}
var drag=false,lx=0,ly=0,pts2={},pinch=0;
canvas.addEventListener('pointerdown',function(e){pts2[e.pointerId]=[e.clientX,e.clientY];drag=true;lx=e.clientX;ly=e.clientY;canvas.style.cursor='grabbing';try{canvas.setPointerCapture(e.pointerId);}catch(x){}});
canvas.addEventListener('pointerup',function(e){delete pts2[e.pointerId];if(Object.keys(pts2).length===0){drag=false;canvas.style.cursor='grab';}pinch=0;});
canvas.addEventListener('pointercancel',function(e){delete pts2[e.pointerId];drag=false;pinch=0;});
canvas.addEventListener('pointermove',function(e){
if(pts2[e.pointerId])pts2[e.pointerId]=[e.clientX,e.clientY];
var ids=Object.keys(pts2);
if(ids.length>=2){
var a=pts2[ids[0]],b=pts2[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
if(pinch)radius=Math.min(680,Math.max(60,radius*(pinch/d)));
pinch=d;return;
}
if(drag){
theta-=(e.clientX-lx)*0.008;
phi=Math.min(1.55,Math.max(0.1,phi-(e.clientY-ly)*0.008));
lx=e.clientX;ly=e.clientY;return;
}
hover(e);
});
canvas.addEventListener('wheel',function(e){e.preventDefault();radius=Math.min(680,Math.max(60,radius*(1+e.deltaY*0.001)));},{passive:false});
var ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function isVis(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function hover(e){
var r=canvas.getBoundingClientRect();
mv.x=((e.clientX-r.left)/r.width)*2-1;mv.y=-((e.clientY-r.top)/r.height)*2+1;
ray.setFromCamera(mv,camera);
var hit=ray.intersectObjects(P,false),txt=DEF;
for(var i=0;i<hit.length;i++){
var o=hit[i].object;
if(isVis(o)&&o.userData.label&&o.userData.label!=='Guard akrilik'){txt=o.userData.label;break;}
}
info.textContent=txt;
}
canvas.addEventListener('pointerleave',function(){info.textContent=DEF;});

var last=performance.now(),cw=0;
function resize(){
var w=canvas.clientWidth,h=canvas.clientHeight;
if(w!==cw){cw=w;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
}
function loop(now){
var dt=Math.min(0.05,(now-last)/1000);last=now;
var sdt=dt*spds[spdI];
if(animOn){tAnim+=sdt;tVib+=dt;if(tAnim>TEND+2.5)tAnim=0;}
applyAll(Math.min(tAnim,TEND),dt);
for(var i=0;i<bowlGroups.length;i++){bowlGroups[i].rotation.y=animOn?Math.sin(tVib*55+i)*0.006:0;}
lamps[2].emissiveIntensity=animOn?1.0:0.1;
lamps[1].emissiveIntensity=animOn?0.1:0.9;
if(autoRot&&!drag)theta+=dt*0.25;
resize();updateCam();
renderer.render(scene,camera);
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
